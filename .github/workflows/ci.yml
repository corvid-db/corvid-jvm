# ci — the JVM-consumer gate.
#
# Per platform × JDK LTS line: fetch + sha256-verify the pinned engine
# release artifacts, compile the JNI shim against them, then Gradle
# test — the golden-suite port (267 executable lines across 8 fixtures)
# replayed through the binding against the DOWNLOADED cdylib — plus the
# six-example tour. A separate Linux job runs the SURFACE.tsv gate
# against the engine's surface list at the pinned tag. Every leg is
# required-green; the job set stays under ~10 minutes (fetch is
# seconds, the suite is sub-second; Gradle's first-run distribution
# download dominates cold legs).
#
# Toolchain policy (scripts/bindings/README.md, engine repo): modern
# minimums, CI tests latest + previous LTS — bytecode floor 17, legs on
# JDK 21 (current LTS) and 17 (floor). Kotlin 2.2.x and Gradle 8.14+
# are wrapper/plugin-pinned in the build files.

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / jdk${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ['21', '17']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Fetch + verify engine artifacts (sha256)
        if: runner.os != 'Windows'
        run: ./fetch.sh

      - name: Fetch + verify engine artifacts (sha256)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./fetch.ps1

      # The JNI shim needs the platform C compiler: cc on macOS/Linux;
      # on Windows msvc-dev-cmd puts MSVC cl on PATH with its env, and
      # build-native.ps1 reads JAVA_HOME (setup-java sets it).
      - name: Build the JNI shim
        if: runner.os != 'Windows'
        run: ./scripts/build-native.sh

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Build the JNI shim (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-native.ps1

      - name: Golden suite + examples (Gradle)
        shell: bash
        run: ./gradlew test examples --console=plain --no-daemon

  surface-gate:
    # docs/SURFACE.tsv vs the engine's surface list at the PINNED tag:
    # every engine construct mapped (binding api + proving test) or N/A
    # with a reason; N/A count pinned to the committed baseline.
    name: surface gate (SURFACE.tsv vs pinned engine)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Resolve docs/SURFACE.tsv against the pinned engine surface
        run: ./scripts/surface-gate.sh
