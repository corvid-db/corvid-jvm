# docs — publish the Dokka API reference to GitHub Pages.
#
# ./gradlew dokkaHtml renders the wrapper's KDoc into build/dokka/html;
# this workflow publishes it at https://corvid-db.github.io/corvid-jvm/
# on every master push (the docs site's binding page links here).
name: docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Dokka HTML
        run: ./gradlew dokkaHtml --console=plain --no-daemon
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/dokka/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
